name: Sincronização Semanal de Camadas Oficiais (ETL PostGIS)

on:
  schedule:
    # Executa todo domingo às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    # Permite execução manual com um clique no painel do GitHub Actions

jobs:
  sync_layers:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Utilitários Geoespaciais (GDAL / ogr2ogr / psql)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin postgresql-client

      - name: Executar Pipeline de ETL Espacial
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 etl/sync_gov_layers.py
