<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <clipPath id="globe-clip">
      <circle cx="500" cy="500" r="485" />
    </clipPath>
  </defs>

  <g clip-path="url(#globe-clip)">
    <!-- 1. Globe Background (Green) -->
    <circle cx="500" cy="500" r="485" fill="#0B8343" />

    <!-- 2. Eye Interior Fill (Clean Blue) -->
    <path d="M 25 500 C 280 362, 720 362, 975 500 C 720 638, 280 638, 25 500 Z" fill="#0087D1" />

    <!-- 3. WHITE GRID LINES -->

    <!-- 3.1 Central Vertical Meridian (Seamlessly enters into eyelid stroke) -->
